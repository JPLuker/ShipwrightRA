name: RetroAchievements validation

on:
  push:
    branches:
      - feature/retroachievements
  workflow_dispatch:

concurrency:
  group: retroachievements-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-build:
    name: Linux build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential $(cat linux-build-deps/apt.txt)

      - name: Configure
        run: |
          cmake --no-warn-unused-cli \
            -H. \
            -Bbuild-cmake \
            -GNinja \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DBUILD_REMOTE_CONTROL=1

      - name: Build
        run: cmake --build build-cmake --config Release -j3
