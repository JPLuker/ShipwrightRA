name: RetroAchievements validation

on:
  push:
    branches:
      - feature/retroachievements
  workflow_dispatch:

concurrency:
  group: retroachievements-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-build:
    name: Linux build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential $(cat linux-build-deps/apt.txt)

      - name: Configure compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-ra-validation
          max-size: "2G"

      - name: Configure
        run: |
          cmake --no-warn-unused-cli \
            -H. \
            -Bbuild-cmake \
            -GNinja \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DBUILD_REMOTE_CONTROL=1 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Test RA dependency linking
        run: |
          cmake -S tests/retroachievements/link-smoke -B build-ra-link-smoke \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_SHIPWRIGHT_RA_RCHEEVOS_SOURCE="$PWD/build-cmake/_deps/shipwright_ra_rcheevos_source-src"
          cmake --build build-ra-link-smoke -j3
          ctest --test-dir build-ra-link-smoke --output-on-failure

      - name: Test RA HTTP transport and manager lifecycle
        run: python3 tests/retroachievements/run_http_tests.py --rcheevos build-cmake/_deps/shipwright_ra_rcheevos_source-src --spdlog /usr --fmt-external

      - name: Compile RA HTTP transport
        run: ninja -C build-cmake soh/CMakeFiles/soh.dir/soh/Enhancements/retroachievements/RetroAchievementsHttp.cpp.o

      - name: Compile RA memory adapter
        run: ninja -C build-cmake soh/CMakeFiles/soh.dir/soh/Enhancements/retroachievements/N64MemoryAdapter.cpp.o

      - name: Test native N64 memory mapping
        run: python3 tests/retroachievements/run_memory_tests.py --build build-cmake

      - name: Compile RA test panel
        run: ninja -C build-cmake soh/CMakeFiles/soh.dir/soh/Enhancements/retroachievements/RetroAchievementsWindow.cpp.o

      - name: Compile RA manager
        run: ninja -C build-cmake soh/CMakeFiles/soh.dir/soh/Enhancements/retroachievements/RetroAchievementsManager.cpp.o

      - name: Compile RA bootstrap
        run: ninja -C build-cmake soh/CMakeFiles/soh.dir/soh/Enhancements/retroachievements/RetroAchievementsBootstrap.cpp.o

      - name: Build
        run: cmake --build build-cmake --config Release -j3
